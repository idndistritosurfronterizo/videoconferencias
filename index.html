<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Conferencias del Distrito Sur Fronterizo</title>
  <!-- API oficial de Jitsi Meet -->
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1a365d;
      color: white;
      text-align: center;
      padding: 2rem 1rem;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 90px;
      height: auto;
      object-fit: contain;
    }

    header h1 { margin: 0; font-size: 2rem; }
    header p { margin-top: 0.5rem; opacity: 0.9; }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-top: 1rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background-color: #2c5282; }
    .btn-danger { background-color: #e53e3e; }
    .btn-danger:hover { background-color: #c53030; }

    .btn-join { background-color: #2b6cb0; margin-right: 5px; }

    .rooms-list {
      list-style: none;
      padding: 0;
    }

    .rooms-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem;
      border-bottom: 1px solid #edf2f7;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .hidden { display: none; }
    #jitsiContainer { width: 100%; height: 500px; margin-top: 1rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <!-- Logo de la Iglesia del Nazareno -->
      <img src="NAZ-removebg-preview.png" alt="Logo Iglesia del Nazareno" class="logo">
      <div>
        <h1>Centro de Conferencias del Distrito Sur Fronterizo</h1>
        <p>Plataforma de Videoconferencias y Reuniones Virtuales</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Sección del Anfitrión -->
    <section class="card">
      <h2>Panel del Anfitrión</h2>
      <p>Crea una nueva sala de conferencia para iniciar tu transmisión:</p>
      <div class="form-group">
        <input type="text" id="roomNameInput" placeholder="Nombre o Tema de la Sala (ej. Estudio Bíblico)">
        <button onclick="crearSala()">Crear e Iniciar Sala</button>
      </div>
    </section>

    <!-- Sección de Salas Disponibles para Usuarios -->
    <section class="card">
      <h2>Salas Disponibles</h2>
      <ul id="roomsList" class="rooms-list">
        <li>Cargando salas activas...</li>
      </ul>
    </section>

    <!-- Contenedor del Video de la Conferencia -->
    <section id="meetSection" class="card hidden">
      <div class="meet-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="currentRoomTitle">Conferencia Activa</h3>
        <button class="btn-danger" onclick="salirDeSala()">Salir de la Sala</button>
      </div>
      <div id="jitsiContainer"></div>
    </section>
  </main>

  <!-- Módulo de Firebase con tus credenciales -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    // Tus credenciales oficiales de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDefoT18tEWUZm5elMlS9XoS8KULEMQW9o",
      authDomain: "videoconferencia-bf1a6.firebaseapp.com",
      projectId: "videoconferencia-bf1a6",
      storageBucket: "videoconferencia-bf1a6.firebasestorage.app",
      messagingSenderId: "449587586923",
      appId: "1:449587586923:web:e594c0bb281252b6084e2e",
      measurementId: "G-E6L78BXYDS"
    };

    // Inicializar Firebase y Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let api = null;

    // Crear sala y guardarla en la base de datos
    window.crearSala = async function() {
      const roomInput = document.getElementById('roomNameInput');
      const roomName = roomInput.value.trim();

      if (!roomName) {
        alert('Por favor, ingresa un nombre para la sala.');
        return;
      }

      const roomId = 'Nazareno_' + roomName.replace(/\s+/g, '_') + '_' + Math.floor(Math.random() * 1000);

      try {
        await addDoc(collection(db, "salas"), {
          titulo: roomName,
          id: roomId,
          creado: new Date()
        });

        roomInput.value = '';
        unirseASala(roomId, roomName);
      } catch (e) {
        console.error("Error al crear la sala: ", e);
        alert("Error al conectar con la base de datos.");
      }
    };

    // Escuchar cambios en la base de datos en tiempo real
    function escucharSalas() {
      const listElement = document.getElementById('roomsList');

      onSnapshot(collection(db, "salas"), (snapshot) => {
        listElement.innerHTML = '';
        
        if (snapshot.empty) {
          listElement.innerHTML = '<li>No hay salas activas en este momento.</li>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const sala = docSnap.data();
          const docId = docSnap.id;

          const li = document.createElement('li');
          li.innerHTML = `
            <span><strong>${sala.titulo}</strong></span>
            <div class="actions">
              <button class="btn-join" onclick="unirseASala('${sala.id}', '${sala.titulo}')">Unirse</button>
              <button class="btn-danger" onclick="eliminarSala('${docId}')">Eliminar</button>
            </div>
          `;
          listElement.appendChild(li);
        });
      });
    }

    // Unirse a una videoconferencia de Jitsi
    window.unirseASala = function(roomId, roomTitle) {
      const domain = 'meet.jit.si';
      const container = document.querySelector('#jitsiContainer');
      
      if (api) {
        api.dispose();
      }

      document.getElementById('meetSection').classList.remove('hidden');
      document.getElementById('currentRoomTitle').innerText = 'Conectado a: ' + roomTitle;

      const options = {
        roomName: roomId,
        width: '100%',
        height: 500,
        parentNode: container,
        lang: 'es'
      };

      api = new JitsiMeetExternalAPI(domain, options);
    };

    // Eliminar la sala de la base de datos (se borra para todos)
    window.eliminarSala = async function(docId) {
      if (confirm('¿Estás seguro de que deseas eliminar esta sala? Se quitará para todos los usuarios.')) {
        try {
          await deleteDoc(doc(db, "salas", docId));
        } catch (e) {
          console.error("Error al borrar la sala: ", e);
        }
      }
    };

    // Salir de la sala actual de la vista local
    window.salirDeSala = function() {
      if (api) {
        api.dispose();
        api = null;
      }
      document.getElementById('meetSection').classList.add('hidden');
    };

    // Iniciar escucha en tiempo real
    escucharSalas();
  </script>
</body>
</html>
