<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Conferencias del Distrito Sur Fronterizo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1a365d;
      color: white;
      text-align: center;
      padding: 2rem 1rem;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 90px;
      height: auto;
      object-fit: contain;
    }

    header h1 { margin: 0; font-size: 2rem; }
    header p { margin-top: 0.5rem; opacity: 0.9; }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-top: 1rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background-color: #2c5282; }
    .btn-danger { background-color: #e53e3e; }
    .btn-danger:hover { background-color: #c53030; }

    .btn-join { background-color: #2b6cb0; margin-right: 5px; }

    .rooms-list {
      list-style: none;
      padding: 0;
    }

    .rooms-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem;
      border-bottom: 1px solid #edf2f7;
      flex-wrap: wrap;
      gap: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .info-badge {
      background-color: #c6f6d5;
      color: #22543d;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      display: inline-block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <!-- Logo de la Iglesia del Nazareno -->
      <img src="NAZ-removebg-preview.png" alt="Logo Iglesia del Nazareno" class="logo">
      <div>
        <h1>Centro de Conferencias del Distrito Sur Fronterizo</h1>
        <p>Plataforma de Videoconferencias y Reuniones Virtuales Ilimitadas</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Sección del Anfitrión -->
    <section class="card">
      <h2>Panel del Anfitrión</h2>
      <p>Crea una nueva sala de conferencia con tiempo 100% ilimitado:</p>
      <div class="form-group">
        <input type="text" id="roomNameInput" placeholder="Nombre o Tema de la Sala (ej. Asamblea Distrital)">
        <button onclick="crearSala()">Crear Sala Ilimitada</button>
      </div>
    </section>

    <!-- Sección de Salas Disponibles para Usuarios -->
    <section class="card">
      <h2>Salas Activas</h2>
      <ul id="roomsList" class="rooms-list">
        <li>Cargando salas activas...</li>
      </ul>
    </section>
  </main>

  <!-- Módulo de Firebase y Lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    // Credenciales oficiales de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDefoT18tEWUZm5elMlS9XoS8KULEMQW9o",
      authDomain: "videoconferencia-bf1a6.firebaseapp.com",
      projectId: "videoconferencia-bf1a6",
      storageBucket: "videoconferencia-bf1a6.firebasestorage.app",
      messagingSenderId: "449587586923",
      appId: "1:449587586923:web:e594c0bb281252b6084e2e",
      measurementId: "G-E6L78BXYDS"
    };

    // Inicializar Firebase y Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Crear sala WebRTC Ilimitada
    window.crearSala = async function() {
      const roomInput = document.getElementById('roomNameInput');
      const roomName = roomInput.value.trim();

      if (!roomName) {
        alert('Por favor, ingresa un nombre para la sala.');
        return;
      }

      const cleanName = roomName.replace(/[^a-zA-Z0-9]/g, '');
      const roomId = `DistritoSur_${cleanName}_${Math.floor(Math.random() * 100000)}`;

      try {
        await addDoc(collection(db, "salas"), {
          titulo: roomName,
          id: roomId,
          creado: new Date()
        });

        roomInput.value = '';
        unirseASala(roomId);
      } catch (e) {
        console.error("Error al crear la sala: ", e);
        alert("Error al conectar con la base de datos.");
      }
    };

    // Escuchar cambios en tiempo real
    function escucharSalas() {
      const listElement = document.getElementById('roomsList');

      onSnapshot(collection(db, "salas"), (snapshot) => {
        listElement.innerHTML = '';
        
        if (snapshot.empty) {
          listElement.innerHTML = '<li>No hay salas activas en este momento.</li>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const sala = docSnap.data();
          const docId = docSnap.id;

          const li = document.createElement('li');
          li.innerHTML = `
            <div>
              <strong>${sala.titulo}</strong><br>
              <span class="info-badge">Tiempo Ilimitado (WebRTC)</span>
            </div>
            <div class="actions">
              <button class="btn-join" onclick="unirseASala('${sala.id}')">Unirse a la Conferencia</button>
              <button class="btn-danger" onclick="eliminarSala('${docId}')">Eliminar</button>
            </div>
          `;
          listElement.appendChild(li);
        });
      });
    }

    // Abrir la sala como participante estándar sin modo director
    window.unirseASala = function(roomId) {
      const urlNinja = `https://vdo.ninja/?room=${roomId}`;
      window.open(urlNinja, '_blank');
    };

    // Eliminar la sala en tiempo real
    window.eliminarSala = async function(docId) {
      if (confirm('¿Estás seguro de que deseas eliminar esta sala? Se quitará para todos los usuarios.')) {
        try {
          await deleteDoc(doc(db, "salas", docId));
        } catch (e) {
          console.error("Error al borrar la sala: ", e);
        }
      }
    };

    // Iniciar escucha
    escucharSalas();
  </script>
</body>
</html>
